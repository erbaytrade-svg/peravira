<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pera Vira</title>
<meta name="theme-color" content="#0F0E0B">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<style>
  :root { color-scheme: dark; --bg:#0F0E0B; --surface:#1A1812; --ink:#F3ECDC; --dim:#BDB296; --line:#2E2A1D; --accent:#C9A45C; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg) radial-gradient(700px 400px at 50% -80px, rgba(201,164,92,.18), transparent 70%) no-repeat; color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:36px 28px; text-align:center; }
  .logo { width:72px; height:72px; border-radius:18px; box-shadow:0 0 0 1px #3A3424, 0 12px 40px rgba(201,164,92,.22); }
  .check { width:44px; height:44px; border-radius:50%; background:var(--accent); color:#14130F; display:flex; align-items:center; justify-content:center; margin:22px auto 16px; font-size:22px; font-weight:700; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:26px; letter-spacing:-.4px; margin:0 0 8px; }
  p { color:var(--dim); margin:0; }
  .lang { padding:16px 0; border-top:1px solid var(--line); margin-top:16px; }
  .lang strong { display:block; color:var(--ink); margin-bottom:2px; }
  [dir="rtl"] { font-family:-apple-system,"Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif; }
  .btn { display:inline-block; margin-top:22px; background:var(--accent); color:#14130F; text-decoration:none; font-weight:600; padding:13px 22px; border-radius:12px; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="icon.png" alt="Pera Vira" width="72" height="72">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Hesabın onaylandı</h1>
    <p>Artık Pera Vira uygulamasına dönüp giriş yapabilirsin.</p>
    <div class="lang"><strong>Your account is confirmed</strong><p>You can now return to the Pera Vira app and sign in.</p></div>
    <div class="lang" dir="rtl" lang="ar"><strong>تم تأكيد حسابك</strong><p>يمكنك الآن العودة إلى تطبيق Pera Vira وتسجيل الدخول.</p></div>
    <a class="btn" href="https://apps.apple.com/app/id6815432878">App Store</a>
  </main>
</body>
</html>
