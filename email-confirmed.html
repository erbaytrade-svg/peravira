<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pera Vira — Hesap Onaylandı</title>
<style>
  :root { --ink:#1E1A12; --dim:#6B6150; --bg:#FAF7F0; --accent:#96702A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { max-width:420px; padding:40px 28px; text-align:center; }
  .check { width:64px; height:64px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:30px; }
  h1 { font-size:24px; letter-spacing:-.5px; margin:0 0 10px; }
  p { color:var(--dim); margin:0 0 6px; }
  .en { color:var(--dim); font-size:14px; margin-top:14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Hesabın onaylandı!</h1>
    <p>Artık Pera Vira uygulamasına dönüp giriş yapabilirsin.</p>
    <p class="en">Your account is confirmed. You can return to the Pera Vira app and sign in.</p>
  </div>
</body>
</html>
